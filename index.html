<!DOCTYPE html>
<html>
<head>
  <base href="/sari-sari-store/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sari-Sari Store - Filipino store management pixel game">

  <!-- Mobile Viewport: Lock scaling, prevent pinch-to-zoom, enable viewport-fit for notches -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS PWA Fullscreen Meta Tags & Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sari-Sari Store">
  <meta name="theme-color" content="#141F2B">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sari-Sari Store Simulator</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent rubber banding, pull-to-refresh, bounce scrolling, and pinch-to-zoom on iOS & Android */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #141F2B;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      position: fixed;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: #F1C40F;
      font-family: monospace;
      font-size: 16px;
      letter-spacing: 1px;
      background-color: #141F2B;
    }

    .pixel-spinner {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      border: 4px solid #34495E;
      border-top-color: #F1C40F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- iOS & Android Audio Auto-Unlocker on First Touch/Tap -->
  <script>
    (function() {
      function unlockAudio() {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            if (!window.__gameAudioCtx) {
              window.__gameAudioCtx = new AudioCtx();
            }
            if (window.__gameAudioCtx.state === 'suspended') {
              window.__gameAudioCtx.resume();
            }
            // Play a 1-sample silent buffer to unlock the audio hardware on iOS
            var buffer = window.__gameAudioCtx.createBuffer(1, 1, 22050);
            var source = window.__gameAudioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(window.__gameAudioCtx.destination);
            source.start(0);
          }
        } catch (e) {}

        // Remove listeners once unlocked
        window.removeEventListener('touchstart', unlockAudio, true);
        window.removeEventListener('touchend', unlockAudio, true);
        window.removeEventListener('click', unlockAudio, true);
        window.removeEventListener('pointerdown', unlockAudio, true);
      }

      window.addEventListener('touchstart', unlockAudio, { capture: true, passive: true });
      window.addEventListener('touchend', unlockAudio, { capture: true, passive: true });
      window.addEventListener('click', unlockAudio, { capture: true, passive: true });
      window.addEventListener('pointerdown', unlockAudio, { capture: true, passive: true });
    })();
  </script>
</head>
<body>
  <div id="loading">
    <div class="pixel-spinner"></div>
    <div>IPINAPASOK ANG TINDAHAN...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
